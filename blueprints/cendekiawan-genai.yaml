AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cendekiawan ToT GenAI Sandbox Blueprint v1.0
  Lightweight GenAI environment for training with $10 budget and 2-day duration.
  Includes: Amazon Bedrock, basic SageMaker, S3 storage, and Lambda for GenAI experiments.
  Optimized for cost-effective learning.

# ─── Parameters ──────────────────────────────────────────────────────────────
Parameters:
  UserName:
    Type: String
    Default: cendekiawan-user
    Description: User identifier for this sandbox

# ─── Resources ───────────────────────────────────────────────────────────────
Resources:

  # ── S3 Bucket for GenAI Data ────────────────────────────────────────────────

  GenAIDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'cendekiawan-genai-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: CleanupAfter2Days
            Status: Enabled
            ExpirationInDays: 2
      Tags:
        - Key: Blueprint
          Value: CendekiawanGenAI
        - Key: Program
          Value: ToT
        - Key: ManagedBy
          Value: InnovationSandbox

  # ── IAM Role for GenAI Services ─────────────────────────────────────────────

  GenAIExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'CendekiawanGenAIRole-${AWS::Region}'
      Description: Execution role for Cendekiawan GenAI training
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
                - sagemaker.amazonaws.com
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Bedrock - Full access for GenAI
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        # S3 - For data storage
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        # Lambda - For GenAI functions
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        # CloudWatch - For logging
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        # SageMaker - Read only for cost savings
        - arn:aws:iam::aws:policy/AmazonSageMakerReadOnly
      Policies:
        - PolicyName: CendekiawanGenAIPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Bedrock model invocation
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ListFoundationModels
                  - bedrock:GetFoundationModel
                Resource: '*'
              # Pass role
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/CendekiawanGenAIRole-${AWS::Region}'
              # SageMaker notebook instances (small instances only)
              - Effect: Allow
                Action:
                  - sagemaker:CreateNotebookInstance
                  - sagemaker:StartNotebookInstance
                  - sagemaker:StopNotebookInstance
                  - sagemaker:DeleteNotebookInstance
                  - sagemaker:DescribeNotebookInstance
                Resource: !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:notebook-instance/*'
                Condition:
                  StringEquals:
                    sagemaker:InstanceTypes:
                      - ml.t3.medium
                      - ml.t3.large
      Tags:
        - Key: Blueprint
          Value: CendekiawanGenAI
        - Key: Program
          Value: ToT

  # ── Lambda Function for GenAI Experiments ───────────────────────────────────

  GenAIExperimentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'cendekiawan-genai-experiment-${AWS::AccountId}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt GenAIExecutionRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DATA_BUCKET: !Ref GenAIDataBucket
          AWS_REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          
          bedrock = boto3.client('bedrock-runtime')
          s3 = boto3.client('s3')
          
          def lambda_handler(event, context):
              """
              Sample GenAI function for Cendekiawan ToT training.
              Demonstrates Bedrock model invocation.
              """
              
              # Example: Invoke Claude model
              try:
                  response = bedrock.invoke_model(
                      modelId='anthropic.claude-v2',
                      body=json.dumps({
                          "prompt": "\n\nHuman: Hello, this is a test from Cendekiawan ToT program!\n\nAssistant:",
                          "max_tokens_to_sample": 100,
                          "temperature": 0.7
                      })
                  )
                  
                  result = json.loads(response['body'].read())
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'message': 'GenAI function working!',
                          'model_response': result,
                          'bucket': os.environ['DATA_BUCKET']
                      })
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({
                          'error': str(e),
                          'message': 'Make sure Bedrock model access is enabled'
                      })
                  }
      Tags:
        - Key: Blueprint
          Value: CendekiawanGenAI
        - Key: Program
          Value: ToT

  # ── DynamoDB Table for GenAI Session Data ───────────────────────────────────

  GenAISessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'cendekiawan-genai-sessions-${AWS::AccountId}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Blueprint
          Value: CendekiawanGenAI
        - Key: Program
          Value: ToT

  # ── SSM Parameter: Quick Start Guide ────────────────────────────────────────

  QuickStartGuide:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cendekiawan-genai/quick-start
      Type: String
      Value: !Sub |
        {
          "program": "Cendekiawan Training of Trainers - AWS GenAI",
          "blueprintVersion": "1.0.0",
          "accountId": "${AWS::AccountId}",
          "region": "${AWS::Region}",
          "budget": "$10 USD",
          "duration": "2 days",
          "resources": {
            "dataBucket": "${GenAIDataBucket}",
            "executionRole": "${GenAIExecutionRole.Arn}",
            "lambdaFunction": "${GenAIExperimentFunction}",
            "sessionTable": "${GenAISessionTable}"
          },
          "services": [
            "Amazon Bedrock (Claude, Titan models)",
            "AWS Lambda (GenAI functions)",
            "Amazon S3 (Data storage)",
            "Amazon DynamoDB (Session data)",
            "Amazon SageMaker (Notebooks - ml.t3.medium only)"
          ],
          "gettingStarted": [
            "1. Go to Amazon Bedrock console",
            "2. Request model access (Claude, Titan)",
            "3. Use Lambda function for quick tests",
            "4. Store data in S3 bucket",
            "5. Monitor costs in Cost Explorer"
          ],
          "costTips": [
            "Use Bedrock on-demand pricing",
            "Stop SageMaker notebooks when not in use",
            "Clean up S3 objects after experiments",
            "Use Lambda for short-running tasks",
            "Monitor spending daily"
          ]
        }
      Description: Quick start guide for Cendekiawan GenAI sandbox
      Tags:
        Blueprint: CendekiawanGenAI
        Program: ToT

# ─── Outputs ─────────────────────────────────────────────────────────────────
Outputs:
  DataBucketName:
    Description: S3 bucket for GenAI data and experiments
    Value: !Ref GenAIDataBucket

  ExecutionRoleArn:
    Description: IAM role for GenAI services (use this for Bedrock, Lambda, SageMaker)
    Value: !GetAtt GenAIExecutionRole.Arn

  LambdaFunctionName:
    Description: Lambda function for GenAI experiments
    Value: !Ref GenAIExperimentFunction

  SessionTableName:
    Description: DynamoDB table for session data
    Value: !Ref GenAISessionTable

  QuickStartGuide:
    Description: Quick start guide (stored in SSM Parameter Store)
    Value: !Ref QuickStartGuide

  BedrockConsoleUrl:
    Description: Amazon Bedrock console URL
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/bedrock/home?region=${AWS::Region}'

  CostExplorerUrl:
    Description: Cost Explorer URL (monitor your spending)
    Value: !Sub 'https://console.aws.amazon.com/cost-management/home?region=${AWS::Region}#/cost-explorer'

  Region:
    Description: Deployment region
    Value: !Ref AWS::Region

