AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ISB Bedrock Rate Limiter - Member Account Resources.
  Deployed via StackSet to every ISB sandbox account.
  Creates CloudWatch alarms on Bedrock TPM/RPM and an SNS topic that the hub
  account's throttle Lambda subscribes to. Throttling itself is enforced by
  an SCP attached from the management account (see infra/cost-controls/
  bedrock-rate-limit/throttle_handler and recovery_handler).

Parameters:
  HubAccountId:
    Type: String
    Description: ISB hub account ID where the throttle Lambda lives.
    AllowedPattern: '^\d{12}$'

  Namespace:
    Type: String
    Description: ISB namespace (e.g. myisb).
    Default: myisb

  TpmThreshold:
    Type: Number
    Description: Tokens-per-minute (input + output) threshold that triggers throttle.
    Default: 100000
    MinValue: 1000

  RpmThreshold:
    Type: Number
    Description: Requests-per-minute threshold that triggers throttle.
    Default: 60
    MinValue: 1

  RpmEvaluationPeriods:
    Type: Number
    Description: Consecutive 1-minute periods over RPM threshold before alarm fires.
    Default: 2
    MinValue: 1
    MaxValue: 10

Resources:

  ThrottleTriggerTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'isb-${Namespace}-bedrock-throttle-trigger'
      DisplayName: ISB Bedrock Throttle Trigger
      # NOTE: No KMS encryption — CloudWatch Alarms cannot publish to SNS topics
      # encrypted with alias/aws/sns (the managed key lacks kms:GenerateDataKey
      # grant for cloudwatch.amazonaws.com). Topic carries only alarm metadata,
      # no sensitive data.

  ThrottleTriggerTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ThrottleTriggerTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref ThrottleTriggerTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*'
          - Sid: AllowHubAccountToManageSubscriptions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${HubAccountId}:root'
            Action:
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:GetTopicAttributes
            Resource: !Ref ThrottleTriggerTopic
            # Note: sns:Unsubscribe is a subscription-level action and is granted
            # implicitly to the subscribe caller (the hub) — no topic policy needed.

  BedrockTpmAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'isb-${Namespace}-bedrock-tpm-${AWS::AccountId}'
      AlarmDescription: !Sub 'Bedrock TPM exceeded ${TpmThreshold} for account ${AWS::AccountId}.'
      ActionsEnabled: true
      AlarmActions:
        - !Ref ThrottleTriggerTopic
      Metrics:
        - Id: input_tokens
          MetricStat:
            Metric:
              Namespace: AWS/Bedrock
              MetricName: InputTokenCount
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: output_tokens
          MetricStat:
            Metric:
              Namespace: AWS/Bedrock
              MetricName: OutputTokenCount
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: total_tokens
          Expression: 'input_tokens + output_tokens'
          Label: TotalTokensPerMinute
          ReturnData: true
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref TpmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  BedrockRpmAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'isb-${Namespace}-bedrock-rpm-${AWS::AccountId}'
      AlarmDescription: !Sub 'Bedrock RPM exceeded ${RpmThreshold} for account ${AWS::AccountId}.'
      ActionsEnabled: true
      AlarmActions:
        - !Ref ThrottleTriggerTopic
      Metrics:
        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Bedrock
              MetricName: Invocations
            Period: 60
            Stat: Sum
          ReturnData: true
      EvaluationPeriods: !Ref RpmEvaluationPeriods
      DatapointsToAlarm: !Ref RpmEvaluationPeriods
      Threshold: !Ref RpmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ThrottleTriggerTopicArn:
    Description: SNS topic ARN that the hub Lambda must subscribe to.
    Value: !Ref ThrottleTriggerTopic
    Export:
      Name: !Sub 'isb-${Namespace}-bedrock-throttle-topic-arn'
