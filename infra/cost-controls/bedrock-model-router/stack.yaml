AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ISB Bedrock Model Router — Cost Optimization.
  Deploys a Lambda-based model router that classifies prompt complexity
  and routes to Claude (complex, multi-region) or Nova Pro (simple).
  Includes DynamoDB prompt cache with configurable TTL.

Parameters:
  Namespace:
    Type: String
    Default: myisb

  ClaudeRegions:
    Type: String
    Default: 'us-east-1,us-west-2,eu-west-1'
    Description: Comma-separated regions for Claude Sonnet (2-3 regions for consolidation).

  NovaRegion:
    Type: String
    Default: us-east-1
    Description: Region for Amazon Nova Pro.

  CacheTtlHours:
    Type: Number
    Default: 24
    MinValue: 1
    MaxValue: 168
    Description: Prompt cache TTL in hours (max 7 days).

  ComplexityThreshold:
    Type: Number
    Default: 500
    Description: Token threshold for complexity classification.

  RouterHandlerS3Bucket:
    Type: String
    Description: S3 bucket holding the router handler zip.

  RouterHandlerS3Key:
    Type: String
    Description: S3 key for the router handler zip.

Resources:

  PromptCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'isb-${Namespace}-bedrock-prompt-cache'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  RouterHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'isb-${Namespace}-bedrock-model-router'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: ModelRouterPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeBedrock
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-pro-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6'
              - Sid: CacheReadWrite
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt PromptCacheTable.Arn

  RouterHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'isb-${Namespace}-bedrock-model-router'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt RouterHandlerRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          CLAUDE_REGIONS: !Ref ClaudeRegions
          NOVA_REGION: !Ref NovaRegion
          CACHE_TABLE_NAME: !Ref PromptCacheTable
          CACHE_TTL_HOURS: !Ref CacheTtlHours
          COMPLEXITY_THRESHOLD: !Ref ComplexityThreshold
      Code:
        S3Bucket: !Ref RouterHandlerS3Bucket
        S3Key: !Ref RouterHandlerS3Key

  RouterFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: AWS_IAM
      TargetFunctionArn: !Ref RouterHandler

  RouterUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RouterHandler
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: AWS_IAM

  # ─── API Gateway (student-facing, API key auth) ─────────────────────────────

  RouterApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'isb-${Namespace}-model-router-api'
      Description: Bedrock Model Router API for ISB students
      ApiKeySourceType: HEADER
      EndpointConfiguration:
        Types:
          - REGIONAL

  RouterApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RouterApi
      ParentId: !GetAtt RouterApi.RootResourceId
      PathPart: invoke

  RouterApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RouterApi
      ResourceId: !Ref RouterApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RouterHandler.Arn}/invocations'

  RouterApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RouterHandler
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RouterApi}/*'

  RouterApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: RouterApiMethod
    Properties:
      RestApiId: !Ref RouterApi

  RouterApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RouterApi
      DeploymentId: !Ref RouterApiDeployment
      StageName: v1
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20

  RouterApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: RouterApiStage
    Properties:
      Name: !Sub 'isb-${Namespace}-student-router-key'
      Description: API key for ISB students to access the model router
      Enabled: true
      StageKeys:
        - RestApiId: !Ref RouterApi
          StageName: v1

  RouterApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: RouterApiStage
    Properties:
      UsagePlanName: !Sub 'isb-${Namespace}-student-plan'
      Description: Rate limits for student model router usage
      ApiStages:
        - ApiId: !Ref RouterApi
          Stage: v1
      Quota:
        Limit: 1000
        Period: DAY
      Throttle:
        BurstLimit: 20
        RateLimit: 10

  RouterApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref RouterApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref RouterApiUsagePlan

Outputs:
  RouterHandlerArn:
    Value: !GetAtt RouterHandler.Arn
    Export:
      Name: !Sub 'isb-${Namespace}-bedrock-model-router-arn'
  RouterFunctionUrl:
    Value: !GetAtt RouterFunctionUrl.FunctionUrl
    Export:
      Name: !Sub 'isb-${Namespace}-bedrock-model-router-url'
  PromptCacheTableName:
    Value: !Ref PromptCacheTable
    Export:
      Name: !Sub 'isb-${Namespace}-bedrock-prompt-cache-table'
  RouterApiEndpoint:
    Value: !Sub 'https://${RouterApi}.execute-api.${AWS::Region}.amazonaws.com/v1/invoke'
    Export:
      Name: !Sub 'isb-${Namespace}-model-router-api-endpoint'
  RouterApiKeyId:
    Value: !Ref RouterApiKey
    Description: API Key ID (use aws apigateway get-api-key --api-key <id> --include-value to get the key value)
